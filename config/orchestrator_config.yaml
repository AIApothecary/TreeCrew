# Claude Code Orchestrator Configuration

# General configuration
general:
  # Enable or disable the orchestrator
  enabled: true
  # Log level: debug, info, warning, error
  log_level: info
  # Base directory for storing orchestrator data
  data_dir: "./data/orchestrator"
  # Maximum number of concurrent tasks
  max_concurrent_tasks: 5
  # Timeout for task execution in seconds
  task_timeout: 300

# Agent Zero Worker Pool configuration
worker_pool:
  # Minimum number of workers in the pool
  min_workers: 2
  # Maximum number of workers in the pool
  max_workers: 10
  # Idle timeout for workers in seconds
  idle_timeout: 60
  # Worker initialization timeout in seconds
  init_timeout: 30
  
  # Agent profiles define configurations for different AI models/providers
  agent_profiles:
    claude_opus_general: # Default profile, based on previous worker_config
      model_provider: "anthropic" # e.g., anthropic, openai, google, ollama
      model_name: "claude-3-opus-20240229"
      # API_KEY should be set as an environment variable (e.g., ANTHROPIC_API_KEY)
      # The specific env var name can be standardized or made configurable per profile if needed.
      max_tokens: 4096
      temperature: 0.7
      stream: false
    # Example for a future coder-specific Claude model (Sonnet)
    # claude_sonnet_coder:
    #   model_provider: "anthropic"
    #   model_name: "claude-3-sonnet-20240229"
    #   max_tokens: 4000
    #   temperature: 0.5
    # Example for a future OpenAI/Codex model
    # openai_davinci_coder:
    #   model_provider: "openai"
    #   model_name: "text-davinci-003" # Or newer equivalent
    #   max_tokens: 2048
    #   temperature: 0.3

  # Maps PoolManager's hardcoded worker types to agent profiles
  # This allows tasks requesting a 'code' worker to use a specific AI profile.
  worker_type_to_profile_mapping:
    code: "claude_opus_general"      # For now, all use the default Claude Opus
    architect: "claude_opus_general"
    debug: "claude_opus_general"
    general: "claude_opus_general"

  # Configuration for the number of workers of each type (as currently used by PoolManager)
  # These counts will determine how many workers of each type are pre-initialized.
  # Each will use the profile defined in worker_type_to_profile_mapping.
  worker_counts:
    code: 2
    architect: 1
    debug: 1
    general: 1

# Context Manager configuration
context_manager:
  # Storage type: file, memory, database
  storage_type: "file"
  # Storage path for file-based storage
  storage_path: "./data/orchestrator/context"
  # Maximum context size in tokens
  max_context_size: 100000
  # Context retention period in days
  retention_period: 7
  # Enable context compression
  enable_compression: true
  # Compression level (1-9)
  compression_level: 6

# Results Processor configuration
results_processor:
  # Storage type: file, memory, database
  storage_type: "file"
  # Storage path for file-based storage
  storage_path: "./data/orchestrator/results"
  # Result retention period in days
  retention_period: 30
  # Enable result compression
  enable_compression: true
  # Compression level (1-9)
  compression_level: 6
  # Post-processing hooks
  post_processing:
    # Enable result summarization
    summarize: true
    # Enable result validation
    validate: true
    # Enable result formatting
    format: true

# Task Master CLI Tool configuration
task_master_cli:
  # Path to the task-master executable
  executable_path: "task-master"
  # Default task file path
  default_task_file: "./tasks/tasks.json"
  # Enable npx fallback (Note: We've moved to global install in Docker, so this might be less relevant)
  enable_npx_fallback: false # Changed to false as task-master is globally installed
  # NPX package name
  npx_package_name: "task-master-ai"
  # Command timeout in seconds
  command_timeout: 60

# Security configuration
security:
  # Enable authentication
  enable_auth: false
  # Authentication type: basic, token, oauth
  auth_type: "basic"
  # Authentication credentials file
  auth_file: "./config/orchestrator_auth.yaml"
  # Enable SSL/TLS
  enable_ssl: false
  # SSL certificate file
  ssl_cert: "./config/ssl/cert.pem"
  # SSL key file
  ssl_key: "./config/ssl/key.pem"